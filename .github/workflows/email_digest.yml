name: Daily Digest (อีเมล Shopee + COD/พัสดุค้าง + sync iShip)

on:
  schedule:
    - cron: "37 2 * * *"   # 09:37 น. เวลาไทย (UTC+7) ทุกวัน — เยื้องจาก :30 พอดี กันชนคิว GitHub Actions
  workflow_dispatch: {}    # กดรันเองได้จาก tab Actions ของ repo

jobs:
  email-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tools/requirements-backup.txt

      - name: Run email digest
        env:
          SUPABASE_URL:             ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:             ${{ secrets.SUPABASE_KEY }}
          EMAIL_ACCOUNTS:           ${{ secrets.EMAIL_ACCOUNTS }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          STAFF_LINE_USER_ID:       ${{ secrets.STAFF_LINE_USER_ID }}
          ISHIP_PHONE:              ${{ secrets.ISHIP_PHONE }}
          ISHIP_PASSWORD:           ${{ secrets.ISHIP_PASSWORD }}
        run: python tools/email_daily_digest.py
